# nginx-Alternative zu Caddy. Zertifikat z. B. mit certbot (certbot --nginx -d gpeptides.net -d www.gpeptides.net).
server {
    listen 80;
    server_name gpeptides.net www.gpeptides.net;
    return 301 https://gpeptides.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gpeptides.net www.gpeptides.net;
    # ssl_certificate     /etc/letsencrypt/live/gpeptides.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gpeptides.net/privkey.pem;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /fonts/  { root /srv/gpeptides/public; expires 7d; add_header Cache-Control "public"; }
    location /thumbs/ { root /srv/gpeptides/public; expires 7d; add_header Cache-Control "public"; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
