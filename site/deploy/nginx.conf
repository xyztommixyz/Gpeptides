# nginx-Alternative zu Caddy. Zertifikat z. B. mit certbot (certbot --nginx -d demo-labs.example -d www.demo-labs.example).
server {
    listen 80;
    server_name demo-labs.example www.demo-labs.example;
    return 301 https://demo-labs.example$request_uri;
}

server {
    listen 443 ssl http2;
    server_name demo-labs.example www.demo-labs.example;
    # ssl_certificate     /etc/letsencrypt/live/demo-labs.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/demo-labs.example/privkey.pem;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /fonts/  { root /srv/demolabs/core/public; expires 7d; add_header Cache-Control "public"; }
    location /thumbs/ { root /srv/demolabs/site; expires 7d; add_header Cache-Control "public"; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
